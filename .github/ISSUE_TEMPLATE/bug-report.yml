name: Runner or verification bug
about: Report a reproducible problem in code, tests, schemas, or release tooling.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Explain what failed and what you expected.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and output
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python, Playwright, Chromium, OS, and generated environment/manifest files.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction steps
    validations:
      required: true
