name: Check external links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/check_links.py --soft-fail --output artifacts/link-check.txt
      - uses: actions/upload-artifact@v4
        with:
          name: external-link-check
          path: artifacts/link-check.txt
          if-no-files-found: error
