name: Validate benchmark data

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate baseline data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python scripts/verify_results.py
      - run: python scripts/verify_checksums.py
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile src/run_benchmark.py src/benchmark_core.py scripts/*.py
