name: Smoke benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "fixtures/**"
      - "requirements*.txt"
      - "Dockerfile"
      - ".github/workflows/smoke-test.yml"

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m playwright install --with-deps chromium
      - run: python src/run_benchmark.py --runs-per-variant 1 --output-dir artifacts/smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-benchmark-output
          path: artifacts/smoke
          if-no-files-found: error
