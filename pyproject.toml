[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "metricfixer-sgtm-benchmark"
version = "1.0.0"
description = "Synthetic web GTM vs server-side GTM architecture benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Metricfixer"}]
dependencies = [
  "aiohttp>=3.10,<4",
  "Pillow>=10,<13",
  "playwright>=1.50,<2",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.20,<5",
  "PyYAML>=6,<7",
]

[project.urls]
Homepage = "https://metricfixer.com/"
Repository = "https://github.com/metricfixerSupportServices/server-side-gtm-benchmark"
Publication = "https://metricfixer.com/publications/analytics-conversion-tracking/server-side-gtm-real-gains-marketing-myths-benchmark"

[tool.setuptools]
py-modules = []
