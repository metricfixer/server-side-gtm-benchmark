<text x="607.5" y="765" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1558B1">11 browser requests</text>
<text x="607.5" y="805" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#475569">4 logical deliveries</text>
<rect x="840" y="190" width="305" height="570" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="882" cy="238" r="25" fill="#1558B1"/>
<text x="882" y="246" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="918" y="247" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#111827">sGTM proxy-only</text>
<rect x="864" y="295" width="257" height="220" rx="16" fill="#E8EFF9"/>
<text x="882" y="330" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1558B1">BROWSER</text>
<circle cx="884" cy="368" r="5" fill="#1558B1"/>
<text x="900" y="375" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#111827">Same 5 browser scripts</text>
<circle cx="884" cy="420" r="5" fill="#1558B1"/>
<text x="900" y="427" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#111827">Same 4 browser events</text>
<circle cx="884" cy="472" r="5" fill="#1558B1"/>
<text x="900" y="479" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#111827">Only endpoint changes</text>
<line x1="992.5" y1="532" x2="992.5" y2="595" stroke="#111827" stroke-width="3"/>
<polygon points="984.5,588 1000.5,588 992.5,604" fill="#111827"/>
<rect x="864" y="620" width="257" height="72" rx="16" fill="#111827"/>
