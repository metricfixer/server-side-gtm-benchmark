<text x="1377.5" y="805" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#475569">4 logical deliveries</text>
<text x="80" y="840" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#475569">Synthetic benchmark • 15 cold loads per variant • Median values • No live vendor endpoints</text>
