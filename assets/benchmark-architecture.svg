<line x1="864" y1="718" x2="1121" y2="718" stroke="#CBD5E1" stroke-width="2"/>
<text x="992.5" y="765" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#1558B1">11 browser requests</text>
<text x="992.5" y="805" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#475569">4 logical deliveries</text>
<rect x="1225" y="190" width="305" height="570" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<circle cx="1267" cy="238" r="25" fill="#1558B1"/>
<text x="1267" y="246" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
<text x="1303" y="247" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#111827">sGTM consolidated</text>
<rect x="1249" y="295" width="257" height="220" rx="16" fill="#E8EFF9"/>
<text x="1267" y="330" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1558B1">BROWSER</text>
<circle cx="1269" cy="368" r="5" fill="#1558B1"/>
<text x="1285" y="375" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#111827">1 small dispatcher</text>
<circle cx="1269" cy="420" r="5" fill="#1558B1"/>
<text x="1285" y="427" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#111827">1 first-party event</text>
<circle cx="1269" cy="472" r="5" fill="#1558B1"/>
<text x="1285" y="479" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#111827">Server fans out to 4 destinations</text>
<line x1="1377.5" y1="532" x2="1377.5" y2="595" stroke="#111827" stroke-width="3"/>
